services:
  - type: web
    name: mizan-uae-compliance-intelligence
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run db:migrate && npm run db:check && npm run build
    startCommand: npm run start
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: MIZAN_DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
