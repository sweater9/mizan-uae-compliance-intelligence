name: Production Verified Corpus Seed

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-seed-once.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mizan-production-corpus-seed
  cancel-in-progress: false

jobs:
  seed-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Seed verified regulatory baseline
        run: node scripts/seed-regulatory-baseline.mjs
        env:
          MIZAN_DATABASE_URL: ${{ secrets.MIZAN_DATABASE_URL }}
      - name: Seed verified CMA baseline
        run: node scripts/seed-cma-baseline.mjs
        env:
          MIZAN_DATABASE_URL: ${{ secrets.MIZAN_DATABASE_URL }}
      - name: Verify production database readiness
        run: npm run db:check
        env:
          MIZAN_DATABASE_URL: ${{ secrets.MIZAN_DATABASE_URL }}
      # One-shot production corpus gate; remove after successful verification.
