name: Production Live Smoke Gate

on:
  push:
    branches: [production-smoke-once]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify production endpoints
        shell: bash
        env:
          BASE_URL: https://mizan-uae-compliance-intelligence.onrender.com
        run: |
          set -euo pipefail
          echo 'Acceptance rerun after production Regulatory Search runtime fix.'
          get() { local label="$1" url="$2" out="$3"; echo "== $label =="; for i in 1 2 3 4 5; do code=$(curl -sS -L --max-time 30 -o "$out" -w '%{http_code}' "$url" || true); echo "$label attempt $i HTTP $code"; if [ "$code" = 200 ]; then return 0; fi; cat "$out" 2>/dev/null || true; sleep 12; done; return 1; }
          get root "$BASE_URL/" /tmp/root.html
          grep -qi 'Mizan' /tmp/root.html
          ! grep -Eqi 'demo|prototype|fictional|sample company|NVIDIA' /tmp/root.html
          get health "$BASE_URL/api/health" /tmp/health.json
          node -e "const x=require('/tmp/health.json'); if (x.status!=='ok') throw Error(JSON.stringify(x))"
          get ready "$BASE_URL/api/ready" /tmp/ready.json
          node -e "const x=require('/tmp/ready.json'); if (x.status!=='ok' || x.checks?.assistantConfiguration!=='configured') throw Error(JSON.stringify(x))"
          for q in AML DFSA ADGM CMA KYC; do
            get "search-$q" "$BASE_URL/api/regulatory-search?q=$q" "/tmp/search-$q.json"
            node -e "const x=require('/tmp/search-$q.json'); const r=x.results||x.data||[]; if(!Array.isArray(r)||r.length<1) throw Error('$q returned no results: '+JSON.stringify(x)); if(r.some(v => v.evidenceStatus && v.evidenceStatus!=='official-verified')) throw Error('$q exposed non-verified evidence')"
          done
          ask() { local label="$1" q="$2" out="$3"; echo "== $label =="; for i in 1 2 3; do code=$(curl -sS --max-time 30 -o "$out" -w '%{http_code}' -H 'Content-Type: application/json' -H "Origin: $BASE_URL" --data "{\"question\":\"$q\"}" "$BASE_URL/api/assistant" || true); echo "$label attempt $i HTTP $code"; if [ "$code" = 200 ]; then return 0; fi; cat "$out" 2>/dev/null || true; sleep 12; done; return 1; }
          ask ask-dfsa 'What does the DFSA require regarding a risk-based AML approach?' /tmp/ask-dfsa.json
          node -e "const x=require('/tmp/ask-dfsa.json'); if(x.verified!==true || !Array.isArray(x.sources) || x.sources.length<1 || !x.answer) throw Error(JSON.stringify(x))"
          ask ask-fi 'What AML/CTF expectations are recorded for financial institutions?' /tmp/ask-fi.json
          node -e "const x=require('/tmp/ask-fi.json'); if(x.verified!==true || !Array.isArray(x.sources) || x.sources.length<1 || !x.answer) throw Error(JSON.stringify(x))"
          ask ask-none 'What are the UAE rules for interplanetary mining licences on Mars?' /tmp/ask-none.json
          node -e "const x=require('/tmp/ask-none.json'); const m='Mizan does not currently have sufficient verified regulatory information to answer this confidently.'; if(x.verified!==false || (x.sources||[]).length!==0 || x.answer!==m) throw Error(JSON.stringify(x))"
          echo 'Production live smoke gate passed.'