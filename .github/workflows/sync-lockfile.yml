name: Sync npm lockfile

on:
  push:
    branches: [mizan-regulatory-data-layer]
    paths:
      - package.json
      - .github/workflows/sync-lockfile.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mizan-regulatory-data-layer
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Regenerate package lock only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync package lock [skip ci]"
          git push origin HEAD:mizan-regulatory-data-layer
