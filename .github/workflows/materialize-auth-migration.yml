name: Materialize auth migration metadata

on:
  push:
    branches: [sweater9-auth-workspace-foundation]
    paths:
      - '.github/workflows/materialize-auth-migration.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sweater9-auth-workspace-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate current Drizzle metadata
        run: npm run db:generate
      - name: Verify generator produced expected snapshot and exactly one migration
        run: |
          test -f drizzle/meta/0007_snapshot.json
          migration="$(find drizzle -maxdepth 1 -type f -name '0007_*.sql' -print)"
          test -n "$migration"
          test "$(printf '%s\n' "$migration" | sed '/^$/d' | wc -l)" -eq 1
          printf '%s\n' "$migration" > /tmp/generated-migration
          git status --short
      - name: Commit generated metadata and remove temporary workflow
        run: |
          migration="$(cat /tmp/generated-migration)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$migration" drizzle/meta/0007_snapshot.json drizzle/meta/_journal.json
          git rm .github/workflows/materialize-auth-migration.yml
          git commit -m 'Synchronize auth workspace Drizzle metadata'
          git push origin HEAD:sweater9-auth-workspace-foundation
