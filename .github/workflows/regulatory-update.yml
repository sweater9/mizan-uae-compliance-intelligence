name: Mizan Regulatory Update

on:
  schedule:
    # UAE is UTC+4 year-round. 21:00 UTC = 01:00 Asia/Dubai on the following day.
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mizan-regulatory-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Trigger production-origin regulatory update
        env:
          MIZAN_INGESTION_API_KEY: ${{ secrets.MIZAN_INGESTION_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$MIZAN_INGESTION_API_KEY"
          response_file="$(mktemp)"
          http_code="$(curl --silent --show-error --location \
            --connect-timeout 15 \
            --max-time 180 \
            --retry 2 \
            --retry-all-errors \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $MIZAN_INGESTION_API_KEY" \
            --header "Content-Type: application/json" \
            --data '{}' \
            https://mizan-uae-compliance-intelligence.onrender.com/api/internal/regulatory-update)"
          cat "$response_file"
          echo
          if [[ "$http_code" -lt 200 || "$http_code" -ge 300 ]]; then
            echo "Production regulatory update failed with HTTP $http_code" >&2
            exit 1
          fi
